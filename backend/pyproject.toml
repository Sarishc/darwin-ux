[project]
name = "darwin-ux-backend"
version = "0.0.0"
description = "DarwinUX backend: API, workers, and AI subsystems."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "langgraph>=1.2.12,<1.3",
    "pgvector>=0.5,<0.6",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.1,<3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "httpx2>=2.13.1",
]

[build-system]
# uv's own build backend: pure-Python, src layout by default, no plugins.
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The distribution is "darwin-ux-backend"; the importable package is "darwin".
module-name = "darwin"

# ---- Ruff: formatter + linter ---------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # import sorting
    "B",   # bugbear (likely bugs)
    "UP",  # pyupgrade (modern syntax for the target version)
]

# ---- mypy: type checker ----------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
# Name test modules by their path (tests.conftest vs tests.integration.conftest),
# so the two conftest.py files don't collide.
explicit_package_bases = true
# Teaches mypy how Pydantic models/settings construct themselves (field types in __init__).
plugins = ["pydantic.mypy"]

# ---- pytest: test runner ---------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Plain `pytest` runs the fast unit suite only. `pytest -m integration`
# (make test-integration) overrides the marker filter and needs PostgreSQL.
addopts = "-ra --strict-markers --import-mode=importlib -m 'not integration'"
markers = [
    "integration: needs the local PostgreSQL 17 darwin_test database",
]
